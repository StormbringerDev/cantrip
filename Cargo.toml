[workspace]
resolver = "2"
members = [
  "apps/cantrip-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/StormbringerDev/cantrip"
authors = ["StormbringerDev"]

[workspace.dependencies]
thiserror = "2.0.20"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

