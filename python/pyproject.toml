[project]
name = "cantrip"
version = "0.1.0"
description = "Prototype interpreter for the Cantrip scripting language"
license = { text = "LGPL-3.0-only" }
authors = [{ name = "ReyekTheNerdy", email = "nightshade7703@proton.me" }]
requires-python = ">= 3.11"
dependencies = []

[project.scripts]
cantrip = "cantrip.cli:main"

[build-system]
requires = ["uv-build >= 0.12.19, <0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
